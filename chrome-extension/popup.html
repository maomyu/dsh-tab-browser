<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>DSH 本机 Chrome</title>
<link rel="stylesheet" href="popup.css">
<main>
  <h1>DSH 本机 Chrome</h1>
  <form id="pair">
    <label for="code">DSH 浏览器 Tab 的连接码</label>
    <input id="code" type="text" required autocomplete="off" spellcheck="false">
    <button type="submit">共享当前网页</button>
  </form>
  <button type="button" id="stop" hidden>结束共享</button>
  <p id="status" role="status"></p>
</main>
<script type="module" src="popup.js"></script>
</html>
